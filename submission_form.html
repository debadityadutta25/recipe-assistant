<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recipe Assistant - Swag Submission Form</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
    .container { max-width: 700px; margin: 0 auto; background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; }
    h1 { color: #f97316; margin-top: 0; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; }
    input, textarea { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-family: monospace; font-size: 0.95rem; box-sizing: border-box; }
    .btn { background: #e65100; color: white; padding: 0.85rem 1.5rem; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; width: 100%; margin-top: 1rem; }
    .btn:hover { background: #f97316; }
    .badge { background: #0284c7; color: white; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; vertical-align: middle; margin-left: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍳 Recipe Assistant <span class="badge">AGY Verified</span></h1>
    <p>Pre-filled submission form for event swag & challenge review:</p>
    
    <form onsubmit="alert('Pre-filled values copied! Use these values for your event portal.'); return false;">
      <div class="form-group">
        <label>GitHub Repository URL</label>
        <input type="text" value="https://github.com/debadityadutta25/recipe-assistant" readonly onclick="this.select()">
      </div>

      <div class="form-group">
        <label>GCP Project ID</label>
        <input type="text" value="qwiklabs-gcp-03-2b2a39607757" readonly onclick="this.select()">
      </div>

      <div class="form-group">
        <label>Reasoning Engine Resource ID</label>
        <input type="text" value="projects/671099702193/locations/us-east1/reasoningEngines/8880792800942096384" readonly onclick="this.select()">
      </div>

      <div class="form-group">
        <label>Cloud Run Frontend URL</label>
        <input type="text" value="https://recipe-assistant-frontend-671099702193.us-east1.run.app" readonly onclick="this.select()">
      </div>

      <div class="form-group">
        <label>Public Cloud Storage Assets Bucket</label>
        <input type="text" value="recipe-assistant-assets-qwiklabs-gcp-03-2b2a39607757" readonly onclick="this.select()">
      </div>

      <div class="form-group">
        <label>Project Capabilities Summary</label>
        <textarea rows="4" readonly onclick="this.select()">Recipe Assistant is an AI culinary companion using ADK, Vertex AI Memory Bank, Firestore recipe database, Google GenAI dish photography (gemini-3.1-flash-lite-image), Google Omni video generation (gemini-omni-flash-preview), Google Maps Places API, TheMealDB REST API, A2UI v0.8 cards, and a rebranded FastAPI chat UI with animated typing indicator.</textarea>
      </div>

      <button type="submit" class="btn">Copy Pre-Filled Values</button>
    </form>
  </div>
</body>
</html>
